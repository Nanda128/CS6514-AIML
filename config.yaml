# Shared experiment settings, loaded by every notebook.
# Values match the Config dataclass in ../main.ipynb.

paths:
  data_dir: data
  checkpoint_dir: checkpoints
  results_dir: results

data:
  url: https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt
  split: [0.8, 0.1, 0.1]     # contiguous train / val / test

experiment:
  context_lengths: [32, 128, 256]
  seeds: [0, 1, 2, 3, 4]
  max_ctx: 256               # evaluation targets start at this index in every split
  quick_test: false          # true only for tiny pipeline checks

model:                       # held fixed across conditions
  n_layer: 4
  n_head: 4
  n_embd: 192
  dropout: 0.1

training:                    # budget held fixed across conditions
  chars_per_step: 16384      # batch size = chars_per_step / context_len
  max_steps: 3000
  lr: 1.0e-3
  min_lr: 1.0e-4
  warmup_steps: 100
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99
  grad_clip: 1.0

eval:                        # validation-based checkpoint selection
  interval: 250
  batches: 20
  seed: 1234

ngram:
  orders: [2, 3, 4, 5, 6, 7, 8]
  discounts: [0.5, 0.75, 0.9]
